<!DOCTYPE html>
<!-- Dev-only probe: loads the demo layout, runs the engine with the debug
     hook, and serialises world state into <title> so headless dumps can
     verify behaviour. Not part of the deliverable. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>probe</title>
<style>
  body { margin: 0; font: 18px/1.6 Georgia, serif; background: #191b1f; color: #ddd; }
  main { max-width: 720px; margin: 0 auto; padding: 260px 20px 40vh; }
  .card { background: #23262c; border: 1px solid #3a3f47; border-radius: 10px; padding: 20px; margin: 30px 0; }
  .img { height: 200px; background: linear-gradient(135deg, #26547c, #4f9d69); border-radius: 10px; margin: 30px 0; }
</style>
</head>
<body>
<main>
  <div class="card">Card one — a landing platform for penguins.</div>
  <p>Some text between the platforms so the page has body.</p>
  <!-- ghost: no background, border, or shadow → must NOT be solid -->
  <div id="ghost" style="width:400px;height:60px;margin:20px 0"></div>
  <!-- bare heading: should collide with its text ink box, not full width -->
  <h3 id="inkhead" style="margin:20px 0;font-size:28px">Short</h3>
  <div class="img"></div>
  <!-- overflow-hidden: child sticks out 200px but must be clipped -->
  <div id="clipper" style="overflow:hidden;height:80px;position:relative;margin:20px 0">
    <div style="background:#4f9d69;width:300px;height:280px"></div>
  </div>
  <!-- pixel mask: two stones with a gap — collision must follow the pixels -->
  <canvas id="stones" width="400" height="100" style="display:block;margin:20px 0"></canvas>
  <!-- inline SVG (like the google.com logo): mask from vector shapes.
       Solid: bar x10-110 y30-70, circle cx240 cy50 r28. Gap in between. -->
  <svg id="vector" width="300" height="80" viewBox="0 0 300 80"
       style="display:block;margin:20px 0" role="img" aria-label="shapes">
    <path d="M10 30 h100 v40 h-100 z" fill="#e94"/>
    <circle cx="240" cy="50" r="28" fill="#4a90d9"/>
  </svg>
  <script>
    (function () {
      var x = document.getElementById("stones").getContext("2d");
      x.fillStyle = "#88aabb";
      x.fillRect(0, 40, 120, 60);
      x.fillRect(280, 40, 120, 60);
    })();
  </script>
  <p>More filler text below the fake image.</p>
  <div class="card" style="height:110px">Card two.</div>
</main>
<pre id="out">no-script</pre>
<script src="../dist/webpenguins.js"></script>
<script>
  var out = document.getElementById("out");
  out.textContent = "script-ran";
  window.onerror = function (msg, src, line) {
    out.textContent += " | ERROR " + msg + " @" + line;
  };
  window.flock = WebPenguins.start({ penguins: 6, trees: 2, debug: true });
  var t0 = performance.now();
  (function poll() {
    var d = window.__webpenguins;
    if (d && d.manager) {
      var m = d.manager;
      var toons = m.toons.slice(0, m.penguinNumber).map(function (p) {
        return [p.type, Math.round(p.x), Math.round(p.y), p.active ? 1 : 0].join(":");
      });
      var rects = d.world.rects.map(function (r) {
        return [r.x, r.y, r.w, r.h].join(",");
      });
      out.textContent =
        "T" + Math.round(performance.now() - t0) +
        " loops:" + d.engine.loopCount + " ticks:" + d.engine.tickCount +
        " err:" + (d.engine.lastError || "none") +
        " | toons " + toons.join(" ") +
        " | rects " + rects.join(" ");
    } else {
      out.textContent = "T" + Math.round(performance.now() - t0) + " | no-debug-hook";
    }
    requestAnimationFrame(poll);
  })();
</script>
</body>
</html>
